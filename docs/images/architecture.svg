<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>How socket.io-server works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1000" height="560" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Clients -->
  <text x="130" y="48" text-anchor="middle" font-weight="600" fill="#57606a">CLIENTS</text>
  <g>
    <rect x="30" y="80" width="200" height="60" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="130" y="105" text-anchor="middle" font-weight="600">Browser</text>
    <text x="130" y="125" text-anchor="middle" fill="#57606a">socket.io-client v4</text>

    <rect x="30" y="160" width="200" height="60" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="130" y="185" text-anchor="middle" font-weight="600">Mobile or Node.js app</text>
    <text x="130" y="205" text-anchor="middle" fill="#57606a">socket.io-client v3 or v4</text>

    <rect x="30" y="240" width="200" height="60" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="130" y="265" text-anchor="middle" font-weight="600">Admin UI</text>
    <text x="130" y="285" text-anchor="middle" fill="#57606a">the official one, on /admin</text>
  </g>
  <text x="130" y="335" text-anchor="middle" fill="#57606a">HTTP long-polling, upgraded</text>
  <text x="130" y="353" text-anchor="middle" fill="#57606a">to WebSocket, on one port</text>

  <!-- The PHP process -->
  <rect x="300" y="64" width="390" height="420" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="495" y="48" text-anchor="middle" font-weight="600" fill="#57606a">ONE PHP PROCESS · WORKERMAN EVENT LOOP</text>

  <rect x="320" y="84" width="350" height="78" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="340" y="108" font-weight="600">Engine.IO v4</text>
  <text x="340" y="129" fill="#24292f">polling · WebSocket · upgrade · heartbeat</text>
  <text x="340" y="148" fill="#24292f">CORS · compression · engine middlewares</text>

  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M230 110 C270 110 280 135 318 135"/>
    <path d="M230 190 C270 190 280 140 318 140"/>
    <path d="M230 270 C270 270 285 145 318 145"/>
  </g>


  <path d="M495 162 V182" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="320" y="184" width="350" height="78" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="340" y="208" font-weight="600">Socket.IO v5</text>
  <text x="340" y="229" fill="#24292f">namespaces · middlewares · rooms · acks</text>
  <text x="340" y="248" fill="#24292f">binary · catch-all · connection state recovery</text>

  <path d="M495 262 V282" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="320" y="284" width="350" height="64" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="340" y="308" font-weight="600">Your code</text>
  <text x="340" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#24292f">$io-&gt;on('connection', fn ($socket) =&gt; …)</text>

  <path d="M495 348 V368" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="320" y="370" width="350" height="94" rx="8" fill="#fbefff" stroke="#c297ff"/>
  <text x="340" y="394" font-weight="600">Adapter: broadcasts and rooms</text>
  <text x="340" y="415" fill="#24292f">InMemoryAdapter · one process (default)</text>
  <text x="340" y="434" fill="#24292f">ChannelAdapter · RedisAdapter · many processes</text>
  <text x="340" y="453" fill="#57606a" font-size="12">emit, socketsJoin, fetchSockets, serverSideEmit…</text>

  <!-- Across processes -->
  <text x="855" y="48" text-anchor="middle" font-weight="600" fill="#57606a">MORE PROCESSES AND MACHINES</text>
  <rect x="750" y="80" width="210" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="855" y="110" text-anchor="middle">PHP process 2</text>
  <rect x="750" y="145" width="210" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="855" y="175" text-anchor="middle">PHP process N, on any machine</text>

  <rect x="750" y="280" width="210" height="64" rx="32" fill="#ffebe9" stroke="#ff8182"/>
  <text x="855" y="307" text-anchor="middle" font-weight="600">Redis</text>
  <text x="855" y="327" text-anchor="middle" fill="#57606a">or a workerman/channel server</text>

  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <path d="M855 195 V276" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M670 417 C720 417 710 312 746 312" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="868" y="240" fill="#57606a">pub/sub</text>

  <rect x="750" y="400" width="210" height="64" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="855" y="425" text-anchor="middle" font-weight="600">Your PHP app (PHP-FPM)</text>
  <text x="855" y="445" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Emitter::redis()-&gt;emit()</text>
  <path d="M855 400 V348" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="500" y="525" text-anchor="middle" fill="#57606a">PHP 8.1+ and Workerman 5 · no other dependency · select(), event or Swoole loops</text>
</svg>
