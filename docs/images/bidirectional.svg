<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
  <title>Bidirectional, event-based communication between a client and a PHP server</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="900" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Client -->
  <rect x="40" y="60" width="230" height="160" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="155" y="125" text-anchor="middle" font-size="18" font-weight="600">Client</text>
  <text x="155" y="150" text-anchor="middle" fill="#57606a">socket.io-client</text>
  <text x="155" y="172" text-anchor="middle" fill="#57606a">browser, mobile, Node.js</text>

  <!-- Server -->
  <rect x="630" y="60" width="230" height="160" rx="10" fill="#fbefff" stroke="#c297ff"/>
  <text x="745" y="125" text-anchor="middle" font-size="18" font-weight="600">Server</text>
  <text x="745" y="150" text-anchor="middle" fill="#57606a">PHP · socket.io-server</text>
  <text x="745" y="172" text-anchor="middle" fill="#57606a">on Workerman</text>

  <!-- Client to server -->
  <path d="M280 110 H620" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="98" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">socket.emit("hello", "world")</text>

  <!-- Server to client -->
  <path d="M620 170 H280" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$socket-&gt;emit('news', $data)</text>

  <text x="450" y="262" text-anchor="middle" fill="#57606a">WebSocket, or HTTP long-polling when it isn't available · events both ways, at any time</text>
</svg>
