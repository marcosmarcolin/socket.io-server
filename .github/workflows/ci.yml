name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - run: composer install --no-interaction

      - run: composer lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: .githooks/gitleaks history

  engine-io-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose run --rm php composer install --no-interaction

      - run: tests/Compliance/engine-io.sh

  socket-io-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose run --rm php composer install --no-interaction

      - run: tests/Compliance/socket-io.sh

  client-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose run --rm php composer install --no-interaction

      - run: tests/Integration/run.sh

      - run: tests/Integration/run.sh recovery

      - run: tests/Integration/run.sh admin

  multi-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose run --rm php composer install --no-interaction

      - run: tests/Integration/run.sh multi-process

      - run: tests/Integration/run.sh recovery-processes

  multi-process-redis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose run --rm php composer install --no-interaction

      - run: tests/Integration/run.sh multi-process-redis

      - run: tests/Integration/run.sh multi-process-redis-streams

      - run: tests/Integration/run.sh recovery-streams

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose run --rm php composer install --no-interaction

      # A small run, so the load test keeps working; the numbers come from local runs.
      - run: CLIENTS=200 ROUNDS=5 tests/Load/run.sh

      # A short soak, so the script keeps working: clients come and go, and no message may be lost.
      - run: DURATION=60 CLIENTS=300 tests/Soak/run.sh

  swoole:
    runs-on: ubuntu-latest
    env:
      LOOP: swoole
    steps:
      - uses: actions/checkout@v7

      - run: docker compose run --rm php composer install --no-interaction

      # The same suites and integration tests, on Workerman's Swoole event loop (tests/Load/Dockerfile).
      - run: tests/Compliance/engine-io.sh
      - run: tests/Compliance/socket-io.sh
      - run: tests/Integration/run.sh
      - run: tests/Integration/run.sh recovery
      - run: tests/Integration/run.sh admin
      - run: tests/Integration/run.sh multi-process
      - run: tests/Integration/run.sh recovery-streams

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose run --rm php composer install --no-interaction

      - run: tests/Integration/run.sh examples

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - run: composer install --no-interaction

      - run: vendor/bin/phpunit
